services:
  db:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_DB: ecologic
      POSTGRES_USER: ecologic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U ecologic]
      interval: 5s
      retries: 10
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://ecologic:${POSTGRES_PASSWORD}@db:5432/ecologic
      ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    ports: ["5173:5173"]
    volumes: [".:/app", "node-modules:/app/node_modules"]
    environment:
      API_PROXY_TARGET: http://api:8000
    depends_on: [api]
volumes:
  postgres-data:
  node-modules:
